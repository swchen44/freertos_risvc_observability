[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "psf-lab"
version = "0.1.0"
description = "Reproducible RISC-V FreeRTOS PSF experiments"
requires-python = ">=3.13,<3.14"
dependencies = ["fastapi==0.142.2", "uvicorn==0.54.0", "python-multipart==0.0.32", "markdown-it-py==4.2.0"]

[project.scripts]
psf-lab = "psf_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["references", "third_party", "artifacts", ".tools", ".superpowers", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
